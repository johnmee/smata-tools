[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smata-archive"
version = "0.1.0"
description = "Download and maintain a local copy of all the documents a SMATA strata owner account can see."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[tool.setuptools]
packages = ["smata"]

[tool.setuptools.package-data]
smata = ["schema.sql"]
